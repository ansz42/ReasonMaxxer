[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-search"
version = "0.1.0"
description = "Adaptive offline search + entropy-weighted LoRA distillation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "torch",
]
train = [
  "torch>=2.3",
  "transformers>=4.51",
  "peft>=0.14",
  "accelerate>=0.33",
  "safetensors>=0.4",
  "sentencepiece>=0.2",
]
unsloth = [
  "unsloth",
  "bitsandbytes>=0.43",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
]
